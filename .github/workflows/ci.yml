name: Morning CI

on:
  push:
    branches: [main, implementation/**]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: morning
          POSTGRES_USER: morning
          POSTGRES_PASSWORD: morning
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U morning -d morning"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      MORNING_ENV: test
      MORNING_DATABASE_URL: postgresql+psycopg://morning:morning@localhost:5432/morning
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check backend tests
      - run: pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build
